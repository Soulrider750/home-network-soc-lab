<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
</defs>
<style>
  text { font-family: Arial, sans-serif; fill: #172033; }
  .title { font-size: 38px; font-weight: 700; fill: white; }
  .subtitle { font-size: 19px; fill: #dbeafe; }
  .section { font-size: 24px; font-weight: 700; }
  .heading { font-size: 21px; font-weight: 700; }
  .body { font-size: 17px; }
  .small { font-size: 15px; fill: #475569; }
  .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  .tunnel { stroke: #2563eb; stroke-width: 4; stroke-dasharray: 10 8; fill: none; marker-end: url(#blueArrow); }
</style>
<rect x="0" y="0" width="1600" height="1060" fill="#f8fafc"/>
<rect x="0" y="0" width="1600" height="110" fill="#102d5a"/>
<text x="55" y="55" class="title">Planned NucBox four-VM architecture</text>
<text x="55" y="88" class="subtitle">OPNsense routing • Omada VLAN trunk • separate public, private, and SOC environments</text>

<rect x="55" y="155" width="430" height="145" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="77" y="194" class="heading">Internet and Cloudflare</text>
<text x="77" y="228" class="body">HTTPS visitors reach public sites</text>
<text x="77" y="253" class="body">Cloudflare Tunnel returns to VLAN 81</text>
<rect x="610" y="155" width="370" height="145" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="632" y="194" class="heading">OPNsense firewall</text>
<text x="632" y="228" class="body">WAN, VLAN gateways, VPN</text>
<text x="632" y="253" class="body">Default-deny inter-VLAN policy</text>
<rect x="1105" y="155" width="440" height="145" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
<text x="1127" y="194" class="heading">Omada managed switch</text>
<text x="1127" y="228" class="body">Tagged trunk to one-NIC NucBox</text>
<text x="1127" y="253" class="body">Access ports and VLAN-mapped AP</text>
<path d="M 485 225 L 610 225" stroke="#475569" stroke-width="3" fill="none"/>
<path d="M 980 225 L 1105 225" class="line"/>
<path d="M 1325 300 L 1325 360" class="line"/>
<rect x="55" y="360" width="1490" height="500" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="88" y="402" class="section">NucBox hypervisor: VLAN-aware bridge, four persistent VMs</text>
<text x="88" y="431" class="small">Management interface only on VLAN 10; OPNsense remains the router between VM zones</text>
<rect x="88" y="468" width="335" height="250" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="110" y="507" class="heading">Public-projects VM • VLAN 81</text>
<text x="110" y="541" class="body">KEV dashboard and portfolio</text>
<text x="110" y="566" class="body">NGINX and cloudflared</text>
<text x="110" y="591" class="body">Public tunnel; no WAN forward</text>
<text x="110" y="616" class="body">No personal-data access</text>
<rect x="450" y="468" width="335" height="250" rx="18" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
<text x="472" y="507" class="heading">Nextcloud VM • VLAN 80</text>
<text x="472" y="541" class="body">Nextcloud app, database, cache</text>
<text x="472" y="566" class="body">Private local/VPN access</text>
<text x="472" y="591" class="body">Separate data and backup</text>
<text x="472" y="616" class="body">No public tunnel route</text>
<rect x="812" y="468" width="335" height="250" rx="18" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
<text x="834" y="507" class="heading">Media/internal VM • VLAN 30</text>
<text x="834" y="541" class="body">Jellyfin and reviewed services</text>
<text x="834" y="566" class="body">Trusted/Media/VPN clients</text>
<text x="834" y="591" class="body">No public video tunnel</text>
<text x="834" y="616" class="body">Private media storage</text>
<rect x="1174" y="468" width="335" height="250" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="1196" y="507" class="heading">SOC VM • VLAN 70</text>
<text x="1196" y="541" class="body">Wazuh and supporting stack</text>
<text x="1196" y="566" class="body">Restricted dashboard access</text>
<text x="1196" y="591" class="body">Specific log-ingestion paths</text>
<text x="1196" y="616" class="body">Shared host failure risk</text>
<path d="M 140 300 L 140 340 L 72 340 L 72 450 L 250 450 L 250 468" class="tunnel"/>
<text x="160" y="334" class="small">tunnel established outbound</text>
<rect x="88" y="755" width="1420" height="74" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="108" y="784" class="body">Approved Trusted/VPN access → Nextcloud and Jellyfin   •   Approved admin/VPN access → Management and SOC</text>
<text x="108" y="811" class="small">Log sources → Wazuh ingestion only. No public-project route into Nextcloud, internal services, or management.</text>
<text x="55" y="915" class="section">Other network zones</text>
<text x="55" y="952" class="body">VLAN 20 Trusted   •   VLAN 40 Media clients   •   VLAN 50 IoT   •   VLAN 60 Guest</text>
<text x="55" y="984" class="body">VLAN 90 temporary Attack Lab   •   VLAN 99 unused-port parking   •   Optional Omada Controller: placement TBD in Management</text>
<text x="55" y="1025" class="small">Planning diagram only. NucBox capacity, VM deployment, firewall behavior, and recovery remain to be validated.</text>
</svg>